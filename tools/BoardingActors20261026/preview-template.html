<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>接舷战 · 角色动态预览</title><style>
:root{font:16px/1.6 "Microsoft YaHei",sans-serif;color-scheme:dark;background:#101922;color:#ebe3d4}*{box-sizing:border-box}body{max-width:1600px;margin:auto;padding:25px}h1{font-size:28px;margin:0}p{color:#b3c1c9}#modes{display:inline-flex;gap:8px;flex-wrap:wrap}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}button,select{font:inherit;padding:8px 14px;background:#253746;color:#f5ead4;border:1px solid #65727a;border-radius:6px;cursor:pointer}button.active{border-color:#d7b062;color:#edca85}figure{margin:0 0 20px;background:#192b37;border:1px solid #3b505d;border-radius:8px;overflow:hidden}figure video{display:block;width:100%}figcaption{padding:10px 16px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}.pair video{width:100%;max-width:640px;margin:auto}.muted{font-size:13px;color:#9bacb5}a{color:#edca85}@media(max-width:800px){.pair{grid-template-columns:1fr}body{padding:14px}}
</style><h1>接舷战 · 角色动态</h1><p>待机时双方完全静止。出牌后按内容出刀、施法、格挡、治疗或准备；动作结束精确回到原姿，脚底固定在甲板。</p><div class="controls"><span id="modes"></span><select id="view" aria-label="画面"><option value="both">双方近景</option><option value="player">我方特写</option><option value="enemy">敌方特写</option><option value="full">完整战场</option></select><label>速度 <select id="speed"><option value="1">正常</option><option value="0.5">0.5× 慢放</option></select></label></div><figure><video id="large" controls autoplay muted loop playsinline></video><figcaption id="caption">双方近景</figcaption></figure><div class="pair"><figure><video id="player" muted loop playsinline></video><figcaption>我方 · 主角与两名水手</figcaption></figure><figure><video id="enemy" muted loop playsinline></video><figcaption>敌方 · 原有编队</figcaption></figure></div><p><a href="__MEDIA_BASE__/gifs/角色出刀.gif">出刀 GIF</a> · <a href="__MEDIA_BASE__/gifs/角色施法.gif">施法 GIF</a> · <a href="__MEDIA_BASE__/gifs/角色格挡.gif">格挡 GIF</a> · <a href="__MEDIA_BASE__/gifs/角色治疗.gif">治疗 GIF</a> · <a href="__MEDIA_BASE__/gifs/角色准备.gif">准备 GIF</a> · <a id="fullpng">全屏 PNG</a></p><p class="muted">正式游戏 UI 与角色网格组件离线采样；近景来自实际相机取景。实际出牌、生命值、特殊船员卡牌保留与暂停恢复由 PlayMode 回归验证。可使用视频时间轴查看完整动作。</p><script>
const frames=__FRAMES__,base='__MEDIA_BASE__/videos/',labels={idle:'待机静止',attack_hit:'出刀与受击',cast_hit:'施法与受击',guard:'格挡',heal:'治疗',prepare:'准备'};let sequence='attack_hit';const large=document.getElementById('large'),children=['player','enemy'].map(id=>document.getElementById(id));const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;for(const [key,label] of Object.entries(labels)){const button=document.createElement('button');button.id=key;button.textContent=label;button.onclick=()=>select(key);document.getElementById('modes').append(button)}function sync(){for(const video of children){if(Math.abs(video.currentTime-large.currentTime)>.12)video.currentTime=large.currentTime;video.playbackRate=large.playbackRate;if(large.paused)video.pause();else video.play().catch(()=>{})}}function select(mode,keep=false){const clock=keep?large.currentTime:0,playing=keep?!large.paused:!reduced;sequence=mode;large.src=base+mode+'_'+document.getElementById('view').value+'.mp4';children.forEach(video=>video.src=base+mode+'_'+video.id+'.mp4');large.onloadedmetadata=()=>{large.currentTime=Math.min(clock,large.duration);large.playbackRate=+document.getElementById('speed').value;if(playing)large.play().catch(()=>{});sync()};for(const key of Object.keys(labels))document.getElementById(key).classList.toggle('active',mode===key);document.getElementById('caption').textContent=labels[mode]+' · '+document.getElementById('view').selectedOptions[0].textContent;const item=frames.find(f=>f.sequence===mode&&f.view==='full');document.getElementById('fullpng').href=item.file.replace(/_[0-9]+[.]jpg$/,'_Keyframe.png')}document.getElementById('view').onchange=()=>select(sequence,true);document.getElementById('speed').onchange=()=>{large.playbackRate=+document.getElementById('speed').value;sync()};['play','pause','seeking','timeupdate','ratechange'].forEach(event=>large.addEventListener(event,sync));select(sequence);
</script></html>
