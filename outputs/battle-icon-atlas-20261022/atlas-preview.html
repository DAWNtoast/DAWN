&lt;script&gt;
(() =&gt; {
  const root=document.getElementById(&#x27;battle-icon-atlas&#x27;);
  const dataset=JSON.parse(document.getElementById(&#x27;atlas-data&#x27;).textContent);
  const tabs=root.querySelector(&#x27;#atlas-tabs&#x27;), panel=root.querySelector(&#x27;#atlas-panel&#x27;);
  const list=root.querySelector(&#x27;#atlas-items&#x27;), caption=root.querySelector(&#x27;#atlas-caption&#x27;);
  const groups=[
    [&#x27;resource&#x27;,&#x27;资源栏&#x27;,&#x27;当前数量／上限；临时法力单独显示。&#x27;],
    [&#x27;status_naval&#x27;,&#x27;炮战状态&#x27;,&#x27;血条下方 · 数值与期限随实时状态变化。&#x27;],
    [&#x27;status_boarding&#x27;,&#x27;接舷状态&#x27;,&#x27;血条下方 · 同名效果按接舷规则单独展示。&#x27;],
    [&#x27;status_doctrine&#x27;,&#x27;持续效果&#x27;,&#x27;特殊牌激活后显示 · 本场炮战有效。&#x27;],
    [&#x27;intent&#x27;,&#x27;敌方意图&#x27;,&#x27;敌方头顶 · 表示下一次行动的预览。&#x27;],
    [&#x27;field&#x27;,&#x27;海面场地&#x27;,&#x27;场地图形为静态帧 · 方向箭头示例朝右。&#x27;],
    [&#x27;cost&#x27;,&#x27;卡面费用&#x27;,&#x27;实际卡框／物品图集裁片 · 动态费用数字不包含在图案中。&#x27;],
    [&#x27;interface&#x27;,&#x27;界面功能&#x27;,&#x27;顶栏与牌堆 · 点击操作图标。&#x27;]
  ];
  let category=&#x27;resource&#x27;, expanded=null;
  const byKey=new Map(dataset.items.map(item=&gt;[item.key,item]));
  const esc=value=&gt;String(value??&#x27;&#x27;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,char=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[char]));
  const sprite=new Image();
  sprite.src=dataset.sprite;
  function icon(canvas,index){
    const ctx=canvas.getContext(&#x27;2d&#x27;);
    const cell=dataset.cell, columns=dataset.columns;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(sprite,(index%columns)*cell,Math.floor(index/columns)*cell,cell,cell,0,0,canvas.width,canvas.height);
  }
  function draw(){
    if(!sprite.complete||!sprite.naturalWidth) return;
    root.querySelectorAll(&#x27;canvas[data-icon]&#x27;).forEach(c=&gt;icon(c,Number(c.dataset.icon)));
  }
  function save(){
    const item=expanded?byKey.get(expanded):null;
    window.openai?.setWidgetState?.({modelContent:{category:groups.find(g=&gt;g[0]===category)[1],selectedIcon:item?.name??null},privateContent:{category,expanded}})?.catch(()=&gt;{});
  }
  function render(){
    const group=groups.find(g=&gt;g[0]===category)||groups[0];
    category=group[0];
    const items=dataset.items.filter(item=&gt;item.category===category);
    tabs.innerHTML=groups.map(g=&gt;`&lt;button class=&quot;nav-link ${g[0]===category?&#x27;active&#x27;:&#x27;&#x27;}&quot; id=&quot;atlas-tab-${g[0]}&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-controls=&quot;atlas-panel&quot; aria-selected=&quot;${g[0]===category}&quot; data-category=&quot;${g[0]}&quot;&gt;${g[1]} &lt;span class=&quot;tabular-nums&quot;&gt;${dataset.items.filter(i=&gt;i.category===g[0]).length}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;);
    panel.setAttribute(&#x27;aria-labelledby&#x27;,&#x27;atlas-tab-&#x27;+category);
    caption.textContent=group[2];
    root.querySelector(&#x27;#atlas-count&#x27;).textContent=`${dataset.items.length} 个条目 · 原始图形与素材 · 2026-10-22`;
    list.innerHTML=items.map(item=&gt;{
      const meta=[item.stage,item.side].filter(Boolean).join(&#x27; · &#x27;);
      const source=String(item.source??&#x27;&#x27;).replaceAll(&#x27;D:/Game/UnityClient/Assets/_Project/&#x27;,&#x27;&#x27;);
      const open=expanded===item.key;
      return `&lt;article class=&quot;atlas-item&quot; data-key=&quot;${esc(item.key)}&quot;&gt;
        &lt;div class=&quot;atlas-item-main&quot;&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-inspect=&quot;${esc(item.key)}&quot; aria-expanded=&quot;${open}&quot; aria-controls=&quot;atlas-zoom-${esc(item.key)}&quot; aria-label=&quot;${open?&#x27;收起&#x27;:&#x27;放大&#x27;}${esc(item.name)}图标&quot; data-tooltip=&quot;放大图标与查看细节&quot;&gt;&lt;canvas class=&quot;atlas-icon&quot; data-icon=&quot;${item.spriteIndex}&quot; width=&quot;128&quot; height=&quot;128&quot; role=&quot;img&quot; aria-label=&quot;${esc(item.name)}实际图标&quot;&gt;&lt;/canvas&gt;&lt;/button&gt;
          &lt;div&gt;&lt;h3&gt;${esc(item.name)}&lt;/h3&gt;&lt;div class=&quot;atlas-meta text-small&quot;&gt;${esc(meta)}&lt;/div&gt;&lt;p&gt;${esc(item.effect)}&lt;/p&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div id=&quot;atlas-zoom-${esc(item.key)}&quot; class=&quot;atlas-zoom&quot; ${open?&#x27;&#x27;:&#x27;hidden&#x27;}&gt;
          &lt;canvas class=&quot;atlas-large&quot; data-icon=&quot;${item.spriteIndex}&quot; width=&quot;320&quot; height=&quot;320&quot; role=&quot;img&quot; aria-label=&quot;${esc(item.name)}放大图标&quot;&gt;&lt;/canvas&gt;
          &lt;div&gt;&lt;div&gt;${esc(item.duration||item.detail||&#x27;图标中的动态数值以战斗时显示为准。&#x27;)}&lt;/div&gt;&lt;div class=&quot;atlas-source text-small text-muted&quot;&gt;来源：${esc(source)}${item.sourceAsset?&#x27;&lt;br&gt;素材：&#x27;+esc(String(item.sourceAsset).split(&#x27;/&#x27;).pop()):&#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/article&gt;`;
    }).join(&#x27;&#x27;);
    draw();
  }
  function applyState(raw){
    const state=raw?.privateContent??raw;
    if(state&amp;&amp;groups.some(g=&gt;g[0]===state.category)) category=state.category;
    expanded=state?.expanded&amp;&amp;byKey.has(state.expanded)?state.expanded:null;
    render();
  }
  tabs.addEventListener(&#x27;click&#x27;,event=&gt;{
    const button=event.target.closest(&#x27;button[data-category]&#x27;);
    if(!button) return;
    category=button.dataset.category; expanded=null; render(); save();
    root.querySelector(&#x27;#atlas-live&#x27;).textContent=`已切换到${groups.find(g=&gt;g[0]===category)[1]}`;
  });
  list.addEventListener(&#x27;click&#x27;,event=&gt;{
    const button=event.target.closest(&#x27;button[data-inspect]&#x27;);
    if(!button) return;
    const key=button.dataset.inspect;
    expanded=expanded===key?null:key;
    list.querySelectorAll(&#x27;[data-inspect]&#x27;).forEach(b=&gt;{
      const open=b.dataset.inspect===expanded;
      b.setAttribute(&#x27;aria-expanded&#x27;,String(open));
      b.setAttribute(&#x27;aria-label&#x27;,(open?&#x27;收起&#x27;:&#x27;放大&#x27;)+byKey.get(b.dataset.inspect).name+&#x27;图标&#x27;);
      document.getElementById(&#x27;atlas-zoom-&#x27;+b.dataset.inspect).hidden=!open;
    });
    save();
  });
  window.addEventListener(&#x27;openai:set_globals&#x27;,event=&gt;{
    const state=event.detail?.globals?.widgetState;
    if(state) applyState(state);
  });
  sprite.addEventListener(&#x27;load&#x27;,draw);
  sprite.addEventListener(&#x27;error&#x27;,()=&gt;{caption.textContent=&#x27;图标载入失败，请重新打开图鉴。&#x27;;caption.setAttribute(&#x27;role&#x27;,&#x27;alert&#x27;);});
  applyState(window.openai?.widgetState);
})();
&lt;/script&gt;

      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
